<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#183f37" />
    <meta
      name="description"
      content="Träna japanska inför GEMA70: partiklar, grammatik och gamla tentor."
    />
    <title>TentaPlugg · Japanska</title>
    <script>
      (function() {
        try {
          const t = localStorage.getItem('tentaplugg-theme');
          if (t === 'sakura') {
            document.documentElement.dataset.theme = 'sakura';
            const m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#a82e66');
          } else {
            document.documentElement.dataset.theme = 'classic';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
